<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shubham Sonale | Research Writer & Analyst</title>
    <meta name="description" content="Personal portfolio of Shubham Sonale, research writer and analyst, featuring research projects, services, and Velora intelligence." />
    <meta property="og:title" content="Shubham Sonale | Research Writer & Analyst" />
    <meta property="og:description" content="Research and analysis, done rigorously. Personal portfolio and Velora AI & Technology intelligence publication." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Preconnect to Google Fonts for lightning-fast font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bundled stylesheet fallback for direct static server deployments -->
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style.css">
  </head>
  <body class="antialiased selection:bg-amber-100 selection:text-amber-900 min-h-screen">
    <div id="root">
      <!-- Instant Pre-rendered Shell: Zero blank flash, immediate visual feedback -->
      <div id="velora-shell" style="min-height: 100vh; background-color: #FAFAF8; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; color: #1F2733; padding: 2rem; text-align: center; box-sizing: border-box;">
        <h1 style="font-size: 2.2rem; font-weight: 600; margin: 0 0 0.5rem 0; letter-spacing: -0.02em; color: #1F2733;">Shubham Sonale</h1>
        <p style="font-family: 'Work Sans', -apple-system, sans-serif; font-size: 0.95rem; color: #5B6472; max-width: 480px; margin: 0 0 1.5rem 0; line-height: 1.5;">
          Research and analysis, done rigorously.
        </p>
        <div style="width: 28px; height: 28px; border: 2.5px solid #DEDACE; border-top-color: #B8791B; border-radius: 50%; animation: velora-spin 0.65s linear infinite;"></div>
        <style>@keyframes velora-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>

    <!-- Main Vite entry point -->

    <!-- Fail-safe static loader: If uncompiled TypeScript cannot execute in direct static hosting (e.g. GitHub Pages serving raw main branch root), seamlessly load the bundled production assets -->
    <script>
      (function() {
        var loaded = false;
        function loadCompiledBundle() {
          if (loaded || window.__REACT_APP_MOUNTED__) return;
          loaded = true;
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js';
          document.body.appendChild(script);
        }

        // 1. Error listener on script tags
        window.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.indexOf('.tsx') !== -1) {
            loadCompiledBundle();
          } else if (e.message && (e.message.indexOf('Failed to resolve module') !== -1 || e.message.indexOf('.tsx') !== -1)) {
            loadCompiledBundle();
          }
        }, true);

        // 2. Safety timeout: If React hasn't mounted after 400ms, trigger bundle loading automatically
        setTimeout(function() {
          if (!window.__REACT_APP_MOUNTED__) {
            loadCompiledBundle();
          }
        }, 400);
      })();
    </script>
  </body>
</html>
