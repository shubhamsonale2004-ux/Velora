<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shubham Sonale | Research Writer & Analyst</title>
    <meta name="description" content="Personal portfolio of Shubham Sonale, research writer and analyst, featuring research projects, services, and Velora intelligence." />
    <meta property="og:title" content="Shubham Sonale | Research Writer & Analyst" />
    <meta property="og:description" content="Research and analysis, done rigorously. Personal portfolio and Velora AI & Technology intelligence publication." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FAFAF8" />
    
    <!-- DNS prefetch & preconnect for external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fast asynchronous font loading with display=swap and zero render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" />
    </noscript>
    
    <!-- Bundled stylesheet fallback for direct static server deployments -->
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style.css">
  </head>
  <body class="antialiased selection:bg-amber-100 selection:text-amber-900 min-h-screen bg-[#FAFAF8] text-[#1F2733]">
    <div id="root">
      <!-- Instant 0ms Pre-rendered Shell: Seamless structural fidelity before JS hydration -->
      <div id="velora-shell" style="min-height: 100vh; background-color: #FAFAF8; font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1F2733; box-sizing: border-box;">
        <header style="border-bottom: 1px solid #DEDACE; padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; max-width: 1040px; margin: 0 auto;">
          <span style="font-family: 'Fraunces', Georgia, serif; font-size: 1.15rem; font-weight: 600; color: #1F2733;">Shubham Sonale</span>
          <div style="display: flex; gap: 1.5rem; align-items: center;">
            <span style="font-size: 0.88rem; color: #5B6472;">About</span>
            <span style="font-size: 0.88rem; color: #5B6472;">Services</span>
            <span style="font-size: 0.88rem; color: #5B6472;">Work</span>
            <span style="border: 1px solid #1F2733; padding: 0.25rem 0.85rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 500;">Velora</span>
          </div>
        </header>

        <main style="max-width: 1040px; margin: 0 auto; padding: 4rem 1.5rem;">
          <h1 style="font-family: 'Fraunces', Georgia, serif; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; color: #1F2733; margin: 0 0 1rem 0; max-width: 16ch;">
            Research and analysis, done rigorously.
          </h1>
          <p style="font-size: 1.05rem; color: #B8791B; font-weight: 500; margin: 0 0 1rem 0;">Research Writer</p>
          <p style="font-size: 1.05rem; color: #5B6472; max-width: 46ch; line-height: 1.6; margin: 0 0 2rem 0;">
            I write clear, well-researched content grounded in careful reading and analysis.
          </p>
          <div style="display: flex; gap: 0.85rem; flex-wrap: wrap;">
            <span style="background-color: #1F2733; color: #FAFAF8; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 0.95rem; font-weight: 500;">View my work</span>
            <span style="border: 1px solid #DEDACE; color: #1F2733; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 0.95rem; font-weight: 500;">Get in touch</span>
          </div>
        </main>
      </div>
    </div>

    <!-- Main Vite entry point -->

    <!-- Fail-safe static loader: If uncompiled TypeScript cannot execute in direct static hosting (e.g. GitHub Pages serving raw main branch root), seamlessly load the bundled production assets -->
    <script>
      (function() {
        var loaded = false;
        function loadCompiledBundle() {
          if (loaded || window.__REACT_APP_MOUNTED__) return;
          loaded = true;
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js';
          document.body.appendChild(script);
        }

        // 1. Error listener on script tags
        window.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.indexOf('.tsx') !== -1) {
            loadCompiledBundle();
          } else if (e.message && (e.message.indexOf('Failed to resolve module') !== -1 || e.message.indexOf('.tsx') !== -1)) {
            loadCompiledBundle();
          }
        }, true);

        // 2. Safety timeout: If React hasn't mounted after 350ms, trigger bundle loading automatically
        setTimeout(function() {
          if (!window.__REACT_APP_MOUNTED__) {
            loadCompiledBundle();
          }
        }, 350);
      })();
    </script>
  </body>
</html>
